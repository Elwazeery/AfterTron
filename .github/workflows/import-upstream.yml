name: Import pinned effectcraft upstream with full Git history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tron-upstream-import-main
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge vetted upstream commit preserving both histories
        env:
          UPSTREAM_URL: https://github.com/storytold/effectcraft.git
          UPSTREAM_SHA: 'de3fec28ed7a3d7a700a9d8ea307779dcda99a8e'
          PRODUCT_NAME: AfterTron
        run: |
          git config user.name 'GemiTron Import Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/import-upstream.sh
